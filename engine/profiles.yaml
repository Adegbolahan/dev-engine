# One profile per repo. A profile says how to recognise the repo and what each
# command key means there. Only list commands you have run by hand.
#
# match:    every condition given must hold.
#   remote: regex tested against `git remote get-url origin`
#   files:  paths that must exist, relative to the repo root
# commands: keys from engine.yaml `commands`; null means "does not apply here".
#
# Template:
#
#   my-service:
#     description: What the repo is, in one line.
#     match:
#       remote: 'github\.com[:/]my-org/my-service(\.git)?$'
#     base_branch: main
#     forge: github
#     commands:
#       typecheck: npm run typecheck
#       lint: npm run lint
#       policy: null
#       test: npm test
#       build: npm run build
#       run: npm run dev

profiles:
  dev-engine:
    description: This plugin. Lets the engine run its own workflows on itself.
    match:
      files: [.claude-plugin/plugin.json, engine/engine.yaml]
    base_branch: main
    forge: none
    commands:
      typecheck: ruby -c scripts/validate.rb
      policy: null
      lint: bash -n scripts/guard-agents.sh && bash -n scripts/guard-agents.test.sh && bash -n scripts/guard-gates.sh && bash -n scripts/guard-gates.test.sh && bash -n scripts/session-start.sh && bash -n scripts/doctor.sh && bash -n scripts/stack.sh
      test: bash scripts/guard-agents.test.sh && bash scripts/guard-gates.test.sh
      build: ruby scripts/validate.rb
      run: null
  skyline:
    description: "Deployment-as-a-service across EKS, GKE and AKS: kopf controller, FastAPI/MCP API, React console, Terraform modules."
    match:
      files: [skyline/reconciler.py, deploy/crds/app.yaml, DESIGN.md]
    base_branch: main
    forge: none
    commands:
      typecheck: cd web && npx --no-install tsc --noEmit
      lint: terraform fmt -check -recursive terraform
      policy: null
      test: .venv/bin/python -m pytest -q && (cd deploy/cloudflare/static-worker && npm test)
      build: cd web && npm run build
      run: null
